<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ziorpure Admin</title>
<style>
:root{--noir:#14100e;--gold:#c8a96a;--ivory:#f4eee4;--sand:#e9e0d1;--stone:#8d8378}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--ivory);color:#201a16}
header{background:var(--noir);color:var(--gold);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;font:600 20px Georgia,serif;letter-spacing:.12em}
main{max-width:1000px;margin:auto;padding:22px}.box{background:#fff;border:1px solid #d9ccb6;padding:20px;margin-bottom:22px}
h2{font:500 24px Georgia,serif;margin:0 0 14px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #cdbfa8;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{background:var(--noir);color:var(--gold);border:0;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}button.ghost{background:none;color:#201a16;border:1px solid #201a16;padding:6px 10px;font-size:13px}button.del{background:none;color:#b3261e;border:1px solid #b3261e;padding:6px 10px;font-size:13px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee3d0}.item img{width:64px;height:64px;object-fit:contain;background:var(--sand)}
.item .pr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.item .pr input{width:110px;padding:6px}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.off{opacity:.5}#msg{min-height:20px;font-size:13px;margin-top:8px;color:#7a5c1e}.hide{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}.item{grid-template-columns:48px 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
</style></head><body>
<header>ZIORPURE ADMIN <button id="logout" class="ghost hide" style="color:var(--gold);border-color:var(--gold)">Log out</button></header>
<main>
<div class="box" id="login"><h2>Admin login</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p><button id="go">Log in</button></p></div>
<div id="app" class="hide">
<div class="box"><h2>Add a product</h2>
<div class="row"><div><label>Name *</label><input id="n"></div><div><label>Tag (e.g. Silky finish)</label><input id="t"></div></div>
<label>Description</label><textarea id="d" rows="2"></textarea>
<div class="row"><div><label>Price (Rs.) — empty = Price on request</label><input id="p" type="number" min="0"></div><div><label>Old price (optional, shows Sale)</label><input id="cp" type="number" min="0"></div></div>
<label>Product image</label><input id="f" type="file" accept="image/*">
<p><button id="add">Add product</button></p></div>
<div class="box"><h2>Your products</h2><div id="list">Loading…</div></div>
</div><div id="msg"></div>
</main>
<script>
/* Paste your Supabase values (same as index.html) */
const URL_='https://ipemgdvwjitffgfmhpem.supabase.co',KEY='sb_publishable_Ijbjb8JWo7uE1Jzza8hDFQ_zzmY4lwl',BUCKET='product-images';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('zp_token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>$('msg').textContent=t;
const H=(x={})=>({apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...x});
async function api(path,opt={}){const r=await fetch(URL_+path,{...opt,headers:H(opt.headers)});if(r.status===401||r.status===403&&!opt.quiet){}
if(!r.ok)throw new Error((await r.text())||r.status);const t=await r.text();return t?JSON.parse(t):null}
function show(){const on=!!token;$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('logout').classList.toggle('hide',!on);if(on)load()}
$('go').onclick=async()=>{try{const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Login failed');token=j.access_token;sessionStorage.setItem('zp_token',token);say('');show()}catch(e){say(e.message)}};
$('logout').onclick=()=>{token=null;sessionStorage.removeItem('zp_token');show()};
async function load(){try{const rows=await api('/rest/v1/products?select=*&order=sort_order.asc,id.asc');
$('list').innerHTML=rows.length?rows.map(p=>`<div class="item ${p.is_active?'':'off'}"><img src="${esc(p.image_url)}" alt=""><div><strong>${esc(p.name)}</strong> <small>${esc(p.tag)}</small><div class="pr">Rs. <input type="number" value="${p.price??''}" id="pr${p.id}" placeholder="—"><input type="number" value="${p.compare_price??''}" id="cp${p.id}" placeholder="old price"><button class="ghost" onclick="savePrice(${p.id})">Save price</button></div></div><div class="acts"><button class="ghost" onclick="patch(${p.id},{in_stock:${!p.in_stock}})">${p.in_stock?'Mark sold out':'Back in stock'}</button><button class="ghost" onclick="patch(${p.id},{is_active:${!p.is_active}})">${p.is_active?'Hide':'Show'}</button><button class="del" onclick="removeP(${p.id},'${esc(p.name).replace(/'/g,'')}')">Delete</button></div></div>`).join(''):'No products yet.'}catch(e){say('Could not load: '+e.message);if(/JWT|expired/i.test(e.message))$('logout').click()}}
const num=v=>v===''||v==null?null:Number(v);
async function patch(id,body){try{await api('/rest/v1/products?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});say('Saved.');load()}catch(e){say(e.message)}}
window.patch=patch;window.savePrice=id=>patch(id,{price:num($('pr'+id).value),compare_price:num($('cp'+id).value)});
window.removeP=async(id,n)=>{if(!confirm('Delete "'+n+'" permanently?'))return;try{await api('/rest/v1/products?id=eq.'+id,{method:'DELETE'});say('Deleted.');load()}catch(e){say(e.message)}};
$('add').onclick=async()=>{const name=$('n').value.trim();if(!name)return say('Name is required.');$('add').disabled=true;say('Adding…');
try{let image_url=null;const f=$('f').files[0];
if(f){const path=Date.now()+'-'+f.name.replace(/[^a-z0-9.]+/gi,'-').toLowerCase();const r=await fetch(`${URL_}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type},body:f});if(!r.ok)throw new Error('Image upload failed: '+await r.text());image_url=`${URL_}/storage/v1/object/public/${BUCKET}/${path}`}
await api('/rest/v1/products',{method:'POST',body:JSON.stringify({name,tag:$('t').value,description:$('d').value,price:num($('p').value),compare_price:num($('cp').value),image_url,sort_order:99})});
['n','t','d','p','cp','f'].forEach(i=>$(i).value='');say('Product added. It is live on the website.');load()}catch(e){say(e.message)}$('add').disabled=false};
show();
</script></body></html>
